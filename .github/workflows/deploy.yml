name: Build-Test-Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: eks-training
  K8S_NAMESPACE: siva-p
  ECR_REPOSITORY: retail-order-tracking
jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install -r backend/requirements.txt -r backend/tests/requirements-test.txt
          PYTHONPATH=backend python -m pytest -q backend/tests
      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHORT_SHA"
          docker build --build-arg APP_VERSION="$SHORT_SHA" -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"
      - name: Deploy and validate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          kubectl set image deployment/retail-order-api api="$IMAGE_URI" -n "$K8S_NAMESPACE"
          if ! kubectl rollout status deployment/retail-order-api -n "$K8S_NAMESPACE" --timeout=180s; then
            echo "Rollout failed; reverting to previous revision..."
            kubectl rollout undo deployment/retail-order-api -n "$K8S_NAMESPACE"
            kubectl rollout status deployment/retail-order-api -n "$K8S_NAMESPACE" --timeout=180s
            exit 1
          fi
          kubectl get deployment retail-order-api -n "$K8S_NAMESPACE"
      # Optional smoke test: set APP_BASE_URL repository variable only after ingress exists.
      - name: Smoke test
        if: ${{ vars.APP_BASE_URL != '' }}
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if ! curl --fail --retry 5 --retry-delay 3 "$APP_BASE_URL/ready"; then
            echo "Smoke test failed; reverting to previous revision..."
            kubectl rollout undo deployment/retail-order-api -n "$K8S_NAMESPACE"
            kubectl rollout status deployment/retail-order-api -n "$K8S_NAMESPACE" --timeout=180s
            exit 1
          fi
