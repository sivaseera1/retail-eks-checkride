
name: Build-Test-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: eks-checkride-shared
  K8S_NAMESPACE: siva-p
  ECR_REPOSITORY: checkride/siva-p

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend unit tests
        run: |
          python -m pip install -r backend/requirements.txt -r backend/tests/requirements-test.txt
          PYTHONPATH=backend python -m pytest -q backend/tests

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN || 'arn:aws:iam::783764579167:role/eks-checkride-shared-siva-p-cicd' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$SHORT_SHA"

          docker build \
            -t "$IMAGE" \
            ./backend

          docker push "$IMAGE"

          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Deploy and validate
        id: deploy
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          # Apply base Service and Deployment (idempotent: creates if missing, updates if present)
          kubectl apply -f deploy/kubernetes/base/service.yaml --request-timeout=30s
          kubectl apply -f deploy/kubernetes/base/deployment.yaml --request-timeout=30s

          # Set image to the newly built immutable SHA
          kubectl set image \
            deployment/retail-order-api \
            api="$IMAGE_URI" \
            -n "$K8S_NAMESPACE" \
            --request-timeout=30s

          # Validate rollout status
          if ! kubectl rollout status \
            deployment/retail-order-api \
            -n "$K8S_NAMESPACE" \
            --timeout=180s; then

            echo "Deployment failed. Attempting rollback..."

            kubectl rollout undo \
              deployment/retail-order-api \
              -n "$K8S_NAMESPACE"

            kubectl rollout status \
              deployment/retail-order-api \
              -n "$K8S_NAMESPACE" \
              --timeout=180s

            exit 1
          fi

          kubectl get deployment retail-order-api \
            -n "$K8S_NAMESPACE"

          kubectl get pods -n "$K8S_NAMESPACE"

      - name: Smoke test
        if: ${{ vars.APP_BASE_URL != '' }}
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          if ! curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            "$APP_BASE_URL/ready"; then

            echo "Smoke test failed. Attempting rollback..."

            kubectl rollout undo \
              deployment/retail-order-api \
              -n "$K8S_NAMESPACE"

            kubectl rollout status \
              deployment/retail-order-api \
              -n "$K8S_NAMESPACE" \
              --timeout=180s

            exit 1
          fi

          echo "Smoke test successful."
