# OPTIONAL: apply only after the EKS administrator confirms AWS Load Balancer
# Controller, IAM permissions, subnet tags, security groups and DNS/TLS setup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-order-api
  namespace: siva-p
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /ready
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: retail-order-api
                port:
                  number: 80
