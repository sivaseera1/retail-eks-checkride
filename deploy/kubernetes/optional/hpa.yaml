apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retail-order-api
  namespace: siva-p
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retail-order-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
