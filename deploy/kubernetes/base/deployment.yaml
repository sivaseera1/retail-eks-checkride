apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-order-api
  namespace: siva-p
  labels:
    app: retail-order-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: retail-order-api
  template:
    metadata:
      labels:
        app: retail-order-api
    spec:
      containers:
        - name: api
          image: 783764579167.dkr.ecr.ap-south-1.amazonaws.com/checkride/siva-p:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SIMULATE_UNREADY
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
